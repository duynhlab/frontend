name: Gateway Smoke

# The no-mock integration gate (Kong local-stack or staging). MANDATORY
# before a production cutover; dispatch-only until a reachable environment
# with a seeded test account is confirmed (then add a nightly schedule).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed frontend origin (E2E_BASE_URL)
        required: true
      gateway_url:
        description: Kong origin the SPA was built against (E2E_GATEWAY_URL)
        required: true
      checkout_mode:
        description: readonly stops before submit; submit places one idempotent order
        type: choice
        options: [readonly, submit]
        default: readonly

permissions:
  contents: read

jobs:
  gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Store E2E_GATEWAY_USERNAME/PASSWORD (a dedicated test account, never
    # production credentials) as environment secrets with required reviewers.
    environment: gateway-smoke
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.61.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run gateway smoke
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_GATEWAY_URL: ${{ inputs.gateway_url }}
          E2E_GATEWAY_CHECKOUT: ${{ inputs.checkout_mode }}
          E2E_GATEWAY_USERNAME: ${{ secrets.E2E_GATEWAY_USERNAME }}
          E2E_GATEWAY_PASSWORD: ${{ secrets.E2E_GATEWAY_PASSWORD }}
        run: npm run test:e2e:gateway

      # test-results-gateway/ is NOT uploaded: failure traces there embed the
      # login request body (the test account password). Inspect them on the
      # runner or rerun locally instead.
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-smoke-report
          path: playwright-report-gateway/
          retention-days: 14
