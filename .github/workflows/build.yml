name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  gitleaks:
    uses: duynhlab/gha-workflows/.github/workflows/gitleaks.yml@6b1c155968c3212b10f0415a07e6e8e3cf04d5a9 # v1.0.1
    permissions:
      contents: read
      security-events: write

  docker-build:
    needs: [lint, gitleaks]
    uses: duynhlab/gha-workflows/.github/workflows/docker-build-node.yml@b271f01094ee7f16271b14575539e62907a50724 # v1.0.0
    with:
      image-name: '${{ github.event.repository.name }}'
      push: true
      sbom: true
      # Sortable tag for Flux image automation (staging ImagePolicy sorts on
      # the run number), alongside the default immutable sha- tag. On a v*
      # tag push the reusable workflow already emits X.Y.Z and X.Y (leading
      # v stripped) — same behavior as the Go services.
      tags: |
        type=raw,value=main-${{ github.run_number }}-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      actions: read

  trivy-scan:
    needs: [docker-build]
    if: needs.docker-build.outputs.scan-status == 'pass'
    uses: duynhlab/gha-workflows/.github/workflows/trivy-scan.yml@6b1c155968c3212b10f0415a07e6e8e3cf04d5a9 # v1.0.1
    with:
      image-ref: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}@${{ needs.docker-build.outputs.digest }}
      severity: 'CRITICAL,HIGH'
      exit-code: '1'
      ignore-unfixed: true
    # Named, not inherited: the only secrets this workflow declares.
    secrets:
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
    permissions:
      contents: read
      packages: read
      security-events: write

  docker-sign:
    needs: [docker-build, trivy-scan]
    uses: duynhlab/gha-workflows/.github/workflows/docker-sign.yml@6b1c155968c3212b10f0415a07e6e8e3cf04d5a9 # v1.0.1
    with:
      tags: ${{ needs.docker-build.outputs.tags }}
      digest: ${{ needs.docker-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  notify:
    if: always()
    needs: [lint, gitleaks, docker-build, trivy-scan, docker-sign]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@6b1c155968c3212b10f0415a07e6e8e3cf04d5a9 # v1.0.1
    with:
      slack_channel_id: "C0AD82A9A74"
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
