name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  pr-checks:
    uses: duynhlab/gha-workflows/.github/workflows/pr-checks.yml@566b62220abb6db150099ca11cb7a9904288f3b5 # main
    with:
      slack_channel_id: "C0AD82A9A74"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # No e2e job on purpose. The Playwright suite drives the real stack — real
  # Keycloak, real gateway, real services — and CI has none of them. It runs
  # as Phase B of the local-stack E2E release audit instead (homelab
  # `local-stack/docs/e2e-audit.md`), which is the gate that blocks a tag.

  notify:
    # Dependabot PRs run without repo secrets — the Slack call can only fail
    # there and paints every deps PR red for no reason.
    if: always() && github.actor != 'dependabot[bot]'
    needs: [pr-checks, lint]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@e321897e5c28e7c861b9d8beb37614e1c5823f42 # main
    with:
      slack_channel_id: "C0AD82A9A74"
      slack_thread_ts: ${{ needs.pr-checks.outputs.slack_thread_ts }}
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
