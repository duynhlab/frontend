name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  pr-checks:
    uses: duynhlab/gha-workflows/.github/workflows/pr-checks.yml@main
    with:
      slack_channel_id: "C0AD82A9A74"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Migration guards
        run: bash scripts/ci/migration-guards.sh

  e2e-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.61.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # App mock OFF + route mocks ON — the deterministic regression gate.
      - name: Run E2E regression
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-mock-mode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.61.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # App mock ON + zero route mocks — protects local/offline development.
      # A fresh dev-server process per job: Vite reads env at startup.
      - name: Run mock-mode smoke
        run: npm run test:e2e:mock-mode

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mock-mode
          path: |
            playwright-report-mock-mode/
            test-results-mock-mode/
          retention-days: 7

  agent-browser:
    # Dogfood gate for the migration branch; demote to nightly after cutover
    # (plan §17.2) rather than taxing every small PR.
    if: startsWith(github.head_ref, 'refactor/shadcn')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.61.1

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Real minified assets + in-app mock data, no backend: the named
      # `dogfood` mode sidesteps the production guard without weakening it.
      - name: Build dogfood bundle
        run: npx vite build --mode dogfood

      - name: Serve preview
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:4173/ >/dev/null

      - name: Run agent-browser cutover checks
        run: BASE_URL=http://localhost:4173 LABEL=ci npm run test:agent:cutover

      - name: Upload dogfood artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-artifacts
          path: dogfood-output/
          retention-days: 14

  # TEMPORARY (remove once Linux baselines are committed): produces the
  # CI-canonical screenshots as an artifact because workflow_dispatch can't
  # target a workflow that doesn't exist on main yet.
  visual-baselines:
    if: startsWith(github.head_ref, 'refactor/shadcn')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.61.1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npx playwright test --project=visual --project=visual-mobile --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          retention-days: 7

  notify:
    # Dependabot PRs run without repo secrets — the Slack call can only fail
    # there and paints every deps PR red for no reason.
    if: always() && github.actor != 'dependabot[bot]'
    needs: [pr-checks, quality, e2e-regression, e2e-mock-mode-smoke]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@main
    with:
      slack_channel_id: "C0AD82A9A74"
      slack_thread_ts: ${{ needs.pr-checks.outputs.slack_thread_ts }}
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
